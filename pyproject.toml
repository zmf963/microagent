[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microagent"
version = "0.1.0"
description = "A Python-implemented, embeddable universal AI agent core library."
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "zm963" }]
dependencies = [
    "openai>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "anyio>=4.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
mcp = [
    "mcp",
]
cron = [
    "apscheduler>=3.10,<4.0",
]
ssh = [
    "paramiko>=3.0,<4.0",
]
browser = [
    "playwright>=1.40,<2.0",
]

[project.scripts]
microagent = "microagent.surface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit a real LLM API (set MICROAGENT_TEST_* env vars)",
]
testpaths = ["tests"]
