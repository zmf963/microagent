[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microagent"
version = "0.1.0"
description = "A 5,000-line embeddable AI agent core library — LLM loop, 22 tools, 4-layer compression pyramid."
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zm963" }]
readme = "README.md"
keywords = ["ai-agent", "llm", "openai", "tool-calling", "autonomous-agent", "agent-framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "anyio>=4.0,<5.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://m4.local:3000/zmf96/microagent"
Documentation = "https://m4.local:3000/zmf96/microagent/src/branch/main/DESIGN.md"
Repository = "https://m4.local:3000/zmf96/microagent"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
mcp = [
    "mcp",
]
cron = [
    "apscheduler>=3.10,<4.0",
]
ssh = [
    "paramiko>=3.0,<4.0",
]
browser = [
    "playwright>=1.40,<2.0",
]

[project.scripts]
microagent = "microagent.surface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit a real LLM API (set MICROAGENT_TEST_* env vars)",
]
testpaths = ["tests"]
